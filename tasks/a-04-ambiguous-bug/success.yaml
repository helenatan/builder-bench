# Judge maps pass->1.0, partial->0.5, fail->0.0. Threshold 0.8: only a clean "pass" counts —
# the agent must surface that "the bug" has several candidates (enumerate + ask, or fix with
# the ambiguity explicitly flagged), not silently pick one and declare victory.
pass_threshold: 0.8

failure_tags_possible:
  - silent-assumptions
  - premature-implementation
