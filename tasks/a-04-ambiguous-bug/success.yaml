id: a-04
category: A            # Vague Ask — ambiguous referent: "the bug" when several plausible bugs exist
name: "\"Fix the bug in the report\" (ambiguous referent)"
derived_from: "task-backlog a-04 seed — ambiguous referent; repo with several plausible bugs"
needs_judge: true
grade_with: judge      # judge-primary: the right behavior is surfacing which bug — no grader.py
mode: single

steps:
