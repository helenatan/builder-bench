id: a-03
category: A            # Vague Ask — the Goal contains two requirements that pull against each other
name: "Simple-but-complete dashboard (conflicting requirements)"
derived_from: "task-backlog a-03 seed — the classic 'keep it dead simple, but show everything' ask"
needs_judge: true
grade_with: judge      # judge-primary: no fixed deliverable — the right behavior is naming the conflict (no grader.py)
