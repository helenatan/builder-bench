name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # No auth, no network, no private/ split — this is exactly what a fresh
      # public clone can run. If it needs a credential, it does not belong here.
      - name: Test
        run: pytest -q

  task-schema:
    name: task manifests are well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate every tasks/*/success.yaml
        run: python scripts/check_tasks.py
      # gold_set.csv is a frozen human reference + a judge snapshot. Nothing in the
      # scoring path reads the judge snapshot, but a stale one misleads anyone who
      # reads the file directly. This fails if a re-judge left it out of sync.
      - name: gold_set.csv judge columns are in sync with labels.csv
        run: python -m judge.validation.sync_gold --check

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CONTRIBUTING.md asks for DCO sign-off rather than a CLA. Check it rather than
      # trusting it — an unsigned commit is a licensing problem, not a style nit.
      - name: Every commit in this PR is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is missing 'Signed-off-by: $author'"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo "Fix with: git rebase --signoff $base && git push --force-with-lease"
            exit 1
          fi
          echo "All commits signed off."

  clean-clone:
    name: graders run without the private split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # private/ is gitignored, so a checkout never has it. This asserts the
      # documented fallback (graders recompute truth from public fixtures)
      # actually holds, rather than trusting the README.
      - name: Assert private/ is absent
        run: test ! -d private/reference && test ! -d private/expected
      - name: Test
        run: pytest -q
